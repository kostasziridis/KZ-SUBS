name: KZ-SUBS

options:
  bundleIdPrefix: gr.kziridis
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # Listed here because the project is generated: the string catalogue carries the
  # Greek translations, but the build only compiles a language the project knows about.
  knownRegions: [en, el, Base]
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_MODULE_VERIFIER: NO

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: 1.1.0
targets:
  KZSubs:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
    settings:
      base:
        PRODUCT_NAME: KZ-SUBS
        PRODUCT_MODULE_NAME: KZSubs
        PRODUCT_BUNDLE_IDENTIFIER: gr.kziridis.kzsubs
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        # Pinned here, not in the Xcode UI: the project is generated, so a UI-only
        # signing change is lost on the next `xcodegen generate`.
        DEVELOPMENT_TEAM: 8NMJPV5YW6
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
          # Fixtures for the DEBUG-only speech check; no reason to ship them.
          EXCLUDED_SOURCE_FILE_NAMES: "test-greek.wav test-english.wav"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: KZ-SUBS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Puts a KZ-SUBS folder in Files, so a subtitle file can be dropped straight in
        # and picked up again. Safe to expose: projects and videos live in Application
        # Support, and this folder starts empty.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryAddUsageDescription: KZ-SUBS saves your finished subtitled video to your photo library. Your video is processed on this iPhone and is never uploaded.
